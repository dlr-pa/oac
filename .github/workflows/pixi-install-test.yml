# Tests that pixi.lock installs and runs the test suite on all three supported
# platforms. Uses --frozen since lock staleness is already caught by
# check-env-exports.yml. This workflow is only about whether the pinned
# environment works.

name: pixi-install

on:
  push:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Detect non-release changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file counts as changed code only if it matches '**' AND
          # none of the excluded release files (the default "some" would match
          # everything via '**'). Output is 'false' only if all changed files
          # are release-only.
          predicate-quantifier: every
          filters: |
            code-changed:
              - '**'
              - '!CHANGELOG.md'
              - '!openairclim/__about__.py'
              - '!CITATION.cff'

  pixi-install:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    name: pixi install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2

      - name: Install dev environment from the locked pixi.lock
        run: pixi install --frozen -e dev

      - name: Run tests
        run: pixi run -e dev test

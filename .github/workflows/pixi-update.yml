name: pixi-update

# Monthly (or on-demand) refresh of pixi.lock via `pixi update`, following
# https://pixi.prefix.dev/latest/integration/ci/updates_github_actions/.
#
# This workflow includes `pixi run -e dev test` as a smoke test, so that no
# broken PRs are created.

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pixi-update:
    name: Update pixi.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Update pixi.lock
        run: pixi update --json | pixi exec pixi-diff-to-markdown > diff.md

      - name: Test the updated environment with pytest
        run: pixi run -e dev test

      - name: Open PR with the updated lockfile
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: pixi.lock
          commit-message: "Update pixi.lock"
          title: "Update pixi.lock"
          body-path: diff.md
          branch: chore/pixi-update
          labels: dependencies

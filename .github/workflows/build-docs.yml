name: docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: false
          activate-environment: oac
          environment-file: ./environment_dev.yaml
          miniforge-version: latest

      - name: Verify environment
        run: |
          conda info
          conda list

      - name: Install Sphinx and doc dependencies
        run: |
          conda activate oac
          pip install -e .

      - name: Resolve repository data cache directory
        id: repo-data-dir
        run: |
          conda activate oac
          echo "path=$(python -c 'from openairclim.repository import get_cache_dir; print(get_cache_dir())')" >> "$GITHUB_OUTPUT"

      - name: Cache repository data
        uses: actions/cache@v4
        with:
          path: ${{ steps.repo-data-dir.outputs.path }}
          # Invalidates whenever the data version or record DOI changes
          key: repository-data-${{ hashFiles('openairclim/repository.py') }}

      - name: Download repository data
        run: |
          conda activate oac
          oac-download-data

      - name: Cache demo notebook input data
        uses: actions/cache@v4
        with:
          path: docs/source/demos/input
          key: demo-input-${{ hashFiles('docs/source/demos/**/*.rst') }}

      # Regenerate coverage badge whenever a deployment is made to github pages
      - name: Generate coverage badge
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          conda activate oac
          python -m openairclim.utils.create_test_files -o tests/core/repository/
          pytest --cov=openairclim --cov-report=xml tests/
          genbadge coverage -i coverage.xml -o docs/source/_static/coverage.svg

      - name: Build Sphinx documentation
        run: |
          conda activate oac
          cd docs
          make html

      - name: Add CNAME file
        run: echo "openairclim.org" > ./docs/build/html/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build/html
          force_orphan: true

name: docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2

      - name: Install dev environment from the locked pixi.lock
        run: pixi install --frozen -e dev

      - name: Verify environment
        run: |
          pixi info
          pixi list -e dev

      - name: Resolve repository data cache directory
        id: repo-data-dir
        run: |
          echo "path=$(pixi run -e dev python -c 'from openairclim.repository import get_cache_dir; print(get_cache_dir())')" >> "$GITHUB_OUTPUT"

      - name: Cache repository data
        uses: actions/cache@v6
        with:
          path: ${{ steps.repo-data-dir.outputs.path }}
          # Invalidates whenever the data version or record DOI changes
          key: repository-data-${{ hashFiles('openairclim/repository.py') }}

      - name: Download repository data
        run: pixi run -e dev oac-download-data

      - name: Cache demo notebook input data
        uses: actions/cache@v6
        with:
          path: docs/source/demos/input
          key: demo-input-${{ hashFiles('docs/source/demos/**/*.md', 'docs/source/demos/**/*.toml') }}

      # myst-nb only (re-)executes a demo notebook when its content has
      # changed (nb_execution_mode = "cache" in conf.py)
      - name: Cache demo notebook execution results
        uses: actions/cache@v6
        with:
          path: docs/build/.jupyter_cache
          key: demo-exec-${{ hashFiles('docs/source/demos/**/*.md', 'docs/source/demos/**/*.toml') }}

      # Regenerate coverage badge whenever a deployment is made to github pages
      - name: Generate coverage badge
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: pixi run -e dev cov-badge

      - name: Build Sphinx documentation
        run: pixi run -e dev sphinx-build -M html docs/source docs/build

      - name: Add CNAME file
        run: echo "openairclim.org" > ./docs/build/html/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build/html
          force_orphan: true

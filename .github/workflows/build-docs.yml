# Builds the documentation and deploys it to GitHub Pages (openairclim.org).
# Runs when a GitHub Release is published, so that the live documentation
# matches the latest release on PyPI/conda-forge, or manually via
# workflow_dispatch (e.g. to publish a documentation fix between releases).
# Manual runs only deploy from main or a tag; on any other branch, they only
# build the documentation, as a check. Non-release builds show the commit hash
# next to the version in the sidebar (see docs/source/conf.py).

name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # tags are needed to detect release builds (see docs/source/conf.py)
          fetch-tags: true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.11.0

      - name: Install dev environment from the locked pixi.lock
        run: pixi install --frozen -e dev

      - name: Verify environment
        run: |
          pixi info
          pixi list -e dev

      - name: Resolve repository data cache directory
        id: repo-data-dir
        run: |
          echo "path=$(pixi run -e dev python -c 'from openairclim.repository import get_cache_dir; print(get_cache_dir())')" >> "$GITHUB_OUTPUT"

      - name: Cache repository data
        uses: actions/cache@v6
        with:
          path: ${{ steps.repo-data-dir.outputs.path }}
          # Invalidates whenever the data version or record DOI changes
          key: repository-data-${{ hashFiles('openairclim/repository.py') }}

      - name: Download repository data
        run: pixi run -e dev oac-download-data

      # Regenerate coverage badge whenever a deployment is made to github pages
      - name: Generate coverage badge
        if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: pixi run -e dev cov-badge

      - name: Build Sphinx documentation
        run: pixi run -e dev sphinx-build -M html docs/source docs/build

      - name: Add CNAME file
        run: echo "openairclim.org" > ./docs/build/html/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build/html
          force_orphan: true

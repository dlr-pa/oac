# This workflow tests conda installations across ubuntu, windows and macOS
# openairclim.utils.create_test_files is executed and tests run with pytest
# 
# This full OS/Python compatibility matrix tests packaging rather than code
# correctness and is only run on push to main/dev, weekly (to catch drift, in
# particular during phases of limited development) and on demand.

name: conda-install

on:
  push:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Detect non-release changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file counts as changed code only if it matches '**' AND
          # none of the excluded release files (the default "some" would match
          # everything via '**'). Output is 'false' only if all changed files
          # are release-only.
          predicate-quantifier: every
          filters: |
            code-changed:
              - '**'
              - '!CHANGELOG.md'
              - '!openairclim/__about__.py'
              - '!CITATION.cff'

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    name: Install and test on (${{ matrix.os }}, Python ${{ matrix.python-version }}, Miniforge)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # full python-version matrix runs on Linux only; Windows and macOS
          # just get one sanity-check version, to catch OS-specific issues.
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v7

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: false
        python-version: ${{ matrix.python-version }}
        environment-file: environment.yaml
        activate-environment: oac_test
        miniforge-version: latest

    # environment_dev.yaml isn't used here because it also includes the
    # documentation and linting dependencies, which aren't needed to run pytest
    - name: Add test dependencies
      run: |
        conda install -n oac_test -c conda-forge pytest pytest-cov -y

    - name: Conda info
      run: |
        conda info
        conda list

    - name: Create test files
      run: python -m openairclim.utils.create_test_files -o tests/core/repository/

    - name: Run tests
      run: pytest tests/

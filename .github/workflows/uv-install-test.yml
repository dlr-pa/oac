# This workflow tests uv-based installations across ubuntu, windows and macOS,
# using the committed uv.lock for a reproducible resolution, and checks that
# uv.lock itself is still up to date with pyproject.toml.
# openairclim.utils.create_test_files is executed and tests run with pytest.
#
# This full OS/Python compatibility matrix tests packaging rather than code
# correctness and is only run on push to main/dev, weekly (to catch drift, in
# particular during phases of limited development) and on demand. lock-check
# is cheap enough to always run alongside it.

name: uv-install

on:
  push:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Detect release-only changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release-only: ${{ steps.filter.outputs.release-only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            release-only:
              - 'CHANGELOG.md'
              - 'openairclim/__about__.py'

  lock-check:
    needs: changes
    if: needs.changes.outputs.release-only != 'true'
    name: uv.lock is up to date with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Check lockfile is current
        run: uv lock --check

  uv-install:
    needs: changes
    if: needs.changes.outputs.release-only != 'true'
    name: uv sync and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # full python-version matrix runs on Linux only; Windows and macOS
          # just get one sanity-check version, to catch OS-specific issues.
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync environment from uv.lock (gui + test extras)
        run: uv sync --extra gui --extra test

      - name: Create test files
        run: uv run python -m openairclim.utils.create_test_files -o tests/core/repository/

      - name: Run tests
        run: uv run pytest tests/

# Fast, single-config sanity check (pixi dev environment from pixi.lock,
# ubuntu) that runs on every push/PR for quick feedback on code correctness.
# pixi is used rather than pip because it installs considerably faster.

name: quick-test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  changes:
    name: Detect non-release changes
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file counts as changed code only if it matches '**' AND
          # none of the excluded release files (the default "some" would match
          # everything via '**'). Output is 'false' only if all changed files
          # are release-only.
          predicate-quantifier: every
          filters: |
            code-changed:
              - '**'
              - '!CHANGELOG.md'
              - '!openairclim/__about__.py'
              - '!CITATION.cff'

  quick-test:
    needs: changes
    if: needs.changes.outputs.code-changed != 'false'
    name: Quick test (pixi, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi and the dev environment
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: dev
          frozen: true

      # the test task generates the test fixture files first
      - name: Run tests
        run: pixi run -e dev test

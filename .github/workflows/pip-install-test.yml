# This workflow tests pip installations across ubuntu, windows and macOS
# openairclim.utils.create_test_files is executed and tests run with pytest

name: pip-install

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  changes:
    name: Detect release-only changes
    runs-on: ubuntu-latest
    outputs:
      release-only: ${{ steps.filter.outputs.release-only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            release-only:
              - 'CHANGELOG.md'
              - 'openairclim/__about__.py'

  pip-install:
    needs: changes
    if: needs.changes.outputs.release-only != 'true'
    name: pip install and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # full python-version matrix runs on Linux only; Windows and macOS
          # just get one sanity-check version, to catch OS-specific issues.
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenAirClim via pip (gui + test extras)
        run: pip install ".[gui,test]"

      - name: Create test files
        run: python -m openairclim.utils.create_test_files -o tests/core/repository/

      - name: Run tests
        run: pytest tests/

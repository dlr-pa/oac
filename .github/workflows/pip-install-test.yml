# This workflow tests pip installations across ubuntu, windows and macOS
# openairclim.utils.create_test_files is executed and tests run with pytest
#
# This full OS/Python compatibility matrix tests packaging rather than code
# correctness and is only run on push to main/dev, weekly (to catch drift, in
# particular during phases of limited development) and on demand.

name: pip-install

on:
  push:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Detect non-release changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file counts as changed code only if it matches '**' AND
          # none of the excluded release files (the default "some" would match
          # everything via '**'). Output is 'false' only if all changed files
          # are release-only.
          predicate-quantifier: every
          filters: |
            code-changed:
              - '**'
              - '!CHANGELOG.md'
              - '!openairclim/__about__.py'
              - '!CITATION.cff'

  pip-install:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    name: pip install and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # full python-version matrix runs on Linux only; Windows and macOS
          # just get one sanity-check version, to catch OS-specific issues.
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --group (PEP 735 dependency groups) requires pip>=25.1, but Python
      # 3.11 and 3.12 still bundle older pip versions (24.0 and 25.0.1)
      - name: Install OpenAirClim via pip (with test dependency group)
        run: |
          python -m pip install --upgrade pip
          pip install . --group test

      - name: Create test files
        run: python -m openairclim.utils.create_test_files -o tests/core/repository/

      - name: Run tests
        run: pytest tests/

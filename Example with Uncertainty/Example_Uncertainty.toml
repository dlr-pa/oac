# Example Scenario 
# Used for the uncertainty analysis for MSc thesis 
# James Dunselman (2026)

# Species considered
[species]
# Species defined in emission inventories
# possible values: "CO2", "H2O", "NOx", "distance"
inv = ["CO2", "H2O", "NOx", "distance"]
# Assumed NOx species in emission inventory
# possible values: "NO", "NO2"
nox = "NO"
# Output / response species
# possible values: "CO2", "H2O", "O3", "CH4", "PMO", "cont", "SWV"
out = ["CO2", "H2O", "O3", "CH4", "PMO", "cont", "SWV"]

# Emission inventories                                                    
[inventories]
dir = "input/"
# Uses 2019 emission inventory
files = [
    "ELK_aviation_2019_res5deg_flat.nc", 
]
# base emission inventories, only considered if rel_to_base = true
rel_to_base = false
base.dir = "input/"
base.files = [
    "time_norm_historic_SSP.nc",
]

# Output options
[output]
# Full simulation run = true, climate metrics only = false
run_oac = true
run_metrics = true
run_plots = false
dir = "results/"
name = "example"
overwrite = true
concentrations = false

# Time settings
[time]
dir = "input/"
# Time range in years: t_start, t_end, step, (t_end not included)
range = [1920, 2020, 1]
# Time evolution of emissions
# Normalizes WRT scenario
file = "time_norm_historic_SSP.nc"

# Global background concentrations
[background]
dir = "../repository/"
CO2.file = "co2_bg.nc"
CO2.scenario = "SSP2-4.5"
CH4.file = "ch4_bg.nc"
CH4.scenario = "SSP2-4.5"
N2O.file = "n2o_bg.nc"
N2O.scenario = "SSP2-4.5"

# Response options
[responses]
dir = "../repository/"
CO2.response_grid = "0D"
CO2.conc.method = "Sausen&Schumann"
# RF method based on Etminan et al. 2016 is used by default.
# CO2.rf.method = "Etminan_2016"
# CO2.rf.attr = "proportional"

H2O.response_grid = "2D"
H2O.rf.file = "resp_RF_H2O.nc" # response surface (AirClim)

O3.response_grid = "2D"
#O3.rf.file = "resp_RF_O3.nc" # tagging response surface
O3.rf.file = "resp_RF_O3_pert.nc" # perturbation response surface (AirClim)

CH4.response_grid = "2D"
#CH4.tau.file = "resp_CH4.nc" # tagging response surface
CH4.tau.file = "resp_CH4_pert.nc" # perturbation response surface (AirClim)

cont.response_grid = "cont"
cont.resp.file = "resp_cont_lf.nc"

# Temperature options
[temperature]
# valid methods: "Boucher&Reddy"
method = "Boucher&Reddy"
# Climate sensitivity parameter, Bengtsson and Schwartz (2013)
CO2.lambda = 0.54
# Efficacies, Ponater et al. 2006, Table 1, Lee et al. (2021), Dunselman (2026)
H2O.efficacy = 1.0
SWV.efficacy = 1.18
O3.efficacy = 1.37
PMO.efficacy = 1.18
CH4.efficacy = 1.18
cont.efficacy = 0.34


# Climate metrics options
[metrics]
# iterate over elements in lists types t_0 and H
types = ["ATR", "AGWP", "AGTP"] # valid climate metrics: AGTP, AGWP, ATR
H = [100]                        # Time horizon, t_final = t_0 + H - 1
t_0 = [1920]                    # Start time for metrics calculation

# aircraft defined in inventory
# following identifiers are NOT allowed: "TOTAL"
# "DEFAULT" is used if "ac" coordinate not defined in emission inventories
# G_250, eff_fac and PMrel must be defined for each aircraft if contrails are
# to be calculated.

[aircraft]
types = ["DEFAULT"]
# dir = "input/"
# file = "ac_def.csv"
DEFAULT.eff_fac = 1.0  # efficiency factor compared to 0.333
DEFAULT.PMrel = 1.0
DEFAULT.G_250 = 1.70
DEFAULT.b = 35

[hydrogen_leakage] # Uses ERF estimates by Sand et al. (2023)
Leakage_modeling = false
# H2 Leakage Rate (Rostami et al. (2023))
Leakage_rate = 0.1 # fraction of total fuel mass

# Configuration for the parametric scenario module.
[parametric]
# The option `enabled = true` activates the module; otherwise, it remains inactive.
enabled = false

[uncertainty_sensitivity_analysis]
# Excel sheet containing uncertainty PDF parameters.
PDF_dir = "uncertainty_distributions.xlsx" 

# Repeated sampling parameters
N_sampling_points = 4096 # Must be power of 2 for Sobol' sequence.
Evaluation_range = "none" # if range is desired, format as list separated by comma.
# Sampling mode. If true, samples for k+2 (Saltelli et al. 2010) columns. 
# If false, samples only for first column (best for uncertainty assessment).
GSA_sampling = false

# Create new set of CSV files.
Create_new_CSV = true # CHANGE THIS AFTER FIRST CREATION!
Sobol_sequence_file = "Sobol_Sequence_Example.csv"
# Should not include metric name, which is added automatically.
Model_outputs_file = "Repeated_Sampling_Example.csv"

# Calculating and plotting uncertainty
N_samples = 32
N_bootstrap = 1000
Generate_plots = true
# File used to calculate uncertainty, sensitivity and surrogate!
File_dir = "ATR100_Repeated_Sampling_Example.csv"

#Surrogate modeling parameters 
Total_samples = 32
Validation_samples = 16 #removed from the total 
Target_error = 0.999

# Sets used for hyperparameter tuning
# Polynomial degree p
Tuning_p = [2, 3, 4]
# Number of training samples N
Tuning_N = [4, 8, 16]


name: oac
channels:
  - conda-forge
dependencies:
  - joblib
  - numpy
  - pandas<3
  - jupyterlab
  - openssl
  - sphinx
  - myst-nb
  - sphinx_rtd_theme
  - sphinxcontrib-mermaid
  - sphinxcontrib-bibtex
  - sphinx-design
  - ipykernel
  - matplotlib
  - netcdf4
  - python<3.14
  - pytest-cov
  - pint
  - xarray
  - ca-certificates
  - mypy
  - pytest
  - pyroma
  - twine
  - ruff
  - scipy
  - deepmerge
  - ambiance
  - panel
  - pydantic
  - param
  - platformdirs
  - requests
  - pip
  - pip:
      # dependencies only available with pip
      - genbadge[coverage]
      - readme_renderer[md]

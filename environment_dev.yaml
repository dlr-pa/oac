- jupyter-sphinx *
- mypy *
- myst-parser *
- pytest *
- pytest-cov *
- python-build *
- ruff *
- snakeviz *
- sphinx *
- sphinxcontrib-bibtex *
- sphinxcontrib-mermaid *
- sphinx-design *
- sphinx_rtd_theme *
- twine *
- ambiance *
- deepmerge *
- joblib *
- matplotlib-base *
- netcdf4 *

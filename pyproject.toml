[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openairclim"
dynamic = ["version"]
description = "A response model for calculating the climate impact of air traffic emissions"
readme = "README.md"
requires-python = ">=3.11.5"
license = { file = "LICENSE" }
authors = [
    {name = "OpenAirClim Team", email = "openairclim@dlr.de"},
]
keywords = [
    "climate",
    "aviation",
    "air traffic",
    "aircraft emissions",
    "climate impact",
    "atmospheric science",
    "non-CO2 effects",
    "contrails",
    "radiative forcing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "joblib",
    "numpy",
    "pandas<3",  # required by openairclim/gui/
    "matplotlib",
    "pint",
    "xarray",
    "netcdf4",
    "scipy",
    "deepmerge",
    "ambiance",
    "pydantic",
    "platformdirs",
    "requests",
]

[project.scripts]
oac-run = "openairclim.__main__:main"
oac-gui = "openairclim.gui.__main__:main"
oac-download-data = "openairclim.repository:main"
oac-download-zenodo = "openairclim.utils.download_zenodo:main"
oac-create-artificial-inventories = "openairclim.utils.create_artificial_inventories:main"
oac-create-time-evolution = "openairclim.utils.create_time_evolution:main"

[project.urls]
Homepage = "https://openairclim.org/"
Repository = "https://github.com/dlr-pa/oac"
Documentation = "https://openairclim.org/"
"Bug Tracker" = "https://github.com/dlr-pa/oac/issues"
Changelog = "https://github.com/dlr-pa/oac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = [
    "panel",
    "param",
]
docs = [
    "openairclim[gui]",
    "sphinx",
    "myst-nb",
    "sphinx_rtd_theme",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-bibtex",
    "sphinx_design",
    "ipykernel",
    "genbadge[coverage]",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "openairclim[gui,docs,test]",
    "black",
    "build",
    "prospector",
    "pylint",
    "mypy",
    "pyroma",
    "twine",
    # comrak (readme_renderer's markdown backend) has no Windows wheel for
    # Python 3.13. Windows gets plain readme_renderer instead.
    "readme_renderer[md]; sys_platform != 'win32'",
    "readme_renderer; sys_platform == 'win32'",
]

[tool.setuptools.dynamic]
version = { attr = "openairclim.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["openairclim*"]

[tool.setuptools.package-data]
openairclim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]


# -- pixi setup ---------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"
netcdf4 = "*"
joblib = "*"
numpy = "*"
pandas = "<3"
matplotlib = "*"
pint = "*"
xarray = "*"
scipy = "*"
deepmerge = "*"
ambiance = "*"
pydantic = "*"
platformdirs = "*"
requests = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# default environment
[tool.pixi.pypi-dependencies]
openairclim = { path = ".", editable = true }

[tool.pixi.tasks]
# run the example.toml file in the default environment
test-example = "cd example && oac-run example.toml"

# regenerate environment_minimal.yaml/environment_dev.yaml
# NOTE: some dependencies are not available at conda-forge. These will be installed
# by pixi automatically, but need to be added to scripts/export.envs.sh manually!
export-envs = "bash scripts/export-envs.sh"

# docs environment
[tool.pixi.feature.docs.dependencies]
sphinx = "*"
myst-nb = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-mermaid = "*"
sphinxcontrib-bibtex = "*"
sphinx-design = "*"
ipykernel = "*"
panel = "*"
param = "*"

[tool.pixi.feature.docs.pypi-dependencies]
openairclim = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.feature.docs.tasks]
docs-build = "cd docs && make html"
docs-clean = "cd docs && make clean"

# dev environment
[tool.pixi.feature.dev.dependencies]
panel = "*"
param = "*"
sphinx = "*"
myst-nb = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-mermaid = "*"
sphinxcontrib-bibtex = "*"
sphinx-design = "*"
ipykernel = "*"
pytest = "*"
pytest-cov = "*"
black = "*"
python-build = "*"  # "build" on PyPI is "python-build" on conda-forge
prospector = "*"
pylint = "*"
mypy = "*"
pyroma = "*"
# twine stays pypi-only (see scripts/export-envs.sh)

[tool.pixi.feature.dev.pypi-dependencies]
openairclim = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.dev.tasks]
# correctness and style mirror the lint.yml workflow
corr-oac = "prospector --tool pyflakes --tool mypy -s medium -P .prospector openairclim"
corr-tests = "prospector --tool pyflakes --tool mypy -s medium -P .prospector tests"
correctness = { depends-on = ["corr-oac", "corr-tests"] }
black-check = "black --check --diff openairclim tests"
black = "black openairclim tests"
prospector-full-oac = "prospector openairclim"
prospector-full-tests = "prospector tests"
style = { depends-on = ["black-check", "prospector-full-oac", "prospector-full-tests"] }

# check the build
build-sdist = "python -m build"
twine-check = "twine check dist/*"
build = { depends-on = ["build-sdist", "twine-check"] }

# render README.md as PyPI would
readme-check = "mkdir -p tmp && python -m readme_renderer README.md -o tmp/readme.html"

# test and coverage-badge mirror the quick-test.yml / build-docs.yml workflows
create-test-files = "python -m openairclim.utils.create_test_files -o tests/core/repository/"
test = { cmd = "pytest", depends-on = ["create-test-files"] }
cov-run = { cmd = "pytest --cov=openairclim --cov-report=xml", depends-on = ["create-test-files"] }
cov-badge = { cmd = "genbadge coverage -i coverage.xml -o docs/source/_static/coverage.svg", depends-on = ["cov-run"] }

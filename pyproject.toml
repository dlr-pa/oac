[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openairclim"
dynamic = ["version"]
description = "A response model for calculating the climate impact of air traffic emissions"
readme = "README.md"
requires-python = ">=3.11.5"
license = { file = "LICENSE" }
authors = [
    {name = "OpenAirClim Team", email = "openairclim@dlr.de"},
]
keywords = [
    "climate",
    "aviation",
    "air traffic",
    "aircraft emissions",
    "climate impact",
    "atmospheric science",
    "non-CO2 effects",
    "contrails",
    "radiative forcing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "joblib",
    "numpy",
    "pandas<3",  # required by openairclim/gui/
    "matplotlib",
    "pint",
    "xarray",
    "netcdf4",
    "scipy",
    "deepmerge",
    "ambiance",
    "pydantic",
    "platformdirs",
    "requests",
]

[project.scripts]
oac-run = "openairclim.__main__:main"
oac-gui = "openairclim.gui.__main__:main"
oac-download-data = "openairclim.repository:main"
oac-download-zenodo = "openairclim.utils.download_zenodo:main"
oac-create-artificial-inventories = "openairclim.utils.create_artificial_inventories:main"
oac-create-time-evolution = "openairclim.utils.create_time_evolution:main"

[project.urls]
Homepage = "https://openairclim.org/"
Repository = "https://github.com/dlr-pa/oac"
Documentation = "https://openairclim.org/"
"Bug Tracker" = "https://github.com/dlr-pa/oac/issues"
Changelog = "https://github.com/dlr-pa/oac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = [
    "panel",
    "param",
]
docs = [
    "sphinx",
    "myst-nb",
    "sphinx_rtd_theme",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-bibtex",
    "sphinx_design",
    "ipykernel",
    "genbadge",
]
# Minimal set actually needed to run tests/
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "openairclim[gui,docs,test]",
    "mypy",
    "pyroma",
    "twine",
    "readme_renderer[md]",
    "ruff",
]

[tool.setuptools.dynamic]
version = { attr = "openairclim.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["openairclim*"]


# -- ruff configuration -------------------------------------------------------

[tool.ruff]
line-length = 88
extend-exclude = ["docs", "ipynb"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "D",      # pydocstyle
    "C90",    # mccabe complexity
    "C4",     # flake8-comprehensions
    "PL",     # pylint
    "S",      # flake8-bandit (dodgy-equivalent)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "PERF",   # perflint
]
ignore = [
    "PLC0415",  # import-outside-toplevel (see .pylintrc)
    "SIM108",   # if-else block vs ternary
    "B905",     # zip without explicit strict
    "RUF001",   # ambiguous unicode in strings
    "PTH",      # use pathlib - gradual migration, not enforced yet
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is idiomatic in pytest, not "dodgy" there

[tool.ruff.format]
# Black-compatible by default; no overrides needed beyond line-length above.

# -- mypy configuration -------------------------------------------------------

[tool.mypy]
ignore_missing_imports = true

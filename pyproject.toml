[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openairclim"
dynamic = ["version"]
description = "A response model for calculating the climate impact of air traffic emissions"
readme = "README.md"
requires-python = ">=3.11.5"
license = { file = "LICENSE" }
authors = [{ name = "OpenAirClim Team", email = "openairclim@dlr.de" }]
keywords = [
    "climate",
    "aviation",
    "air traffic",
    "aircraft emissions",
    "climate impact",
    "atmospheric science",
    "non-CO2 effects",
    "contrails",
    "radiative forcing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ambiance",
    "deepmerge",
    "joblib",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas<3",  # required by openairclim/gui/
    "pillow",
    "pint",
    "platformdirs",
    "pydantic",
    "requests",
    "scipy",
    "xarray",
]

[project.scripts]
oac-run = "openairclim.__main__:main"
oac-gui = "openairclim.gui.__main__:main"
oac-download-data = "openairclim.repository:main"
oac-download-zenodo = "openairclim.utils.download_zenodo:main"
oac-create-artificial-inventories = "openairclim.utils.create_artificial_inventories:main"
oac-create-time-evolution = "openairclim.utils.create_time_evolution:main"
oac-get-metadata = "openairclim.utils.output_metadata:main_get_metadata"
oac-config-from-nc = "openairclim.utils.output_metadata:main_write_config_from_netcdf"

[project.urls]
Homepage = "https://openairclim.org/"
Repository = "https://github.com/dlr-pa/oac"
Documentation = "https://openairclim.org/"
"Bug Tracker" = "https://github.com/dlr-pa/oac/issues"
Changelog = "https://github.com/dlr-pa/oac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = [
    "panel",
    "param",
]
docs = [
    "openairclim[gui]",
    "genbadge[coverage]",
    "ipykernel",
    "myst-nb",
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-mermaid",
    "sphinx_design",
    "sphinx_rtd_theme",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "openairclim[gui,docs,test]",
    "build",
    "mypy",
    "ruff",
    "snakeviz",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "openairclim.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["openairclim*"]

[tool.setuptools.package-data]
openairclim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]


# -- ruff configuration -------------------------------------------------------

[tool.ruff]
line-length = 88
extend-exclude = ["docs", "ipynb", "openairclim/gui", "tests/gui"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "D",      # pydocstyle
    "C90",    # mccabe complexity
    "C4",     # flake8-comprehensions
    "PL",     # pylint
    "S",      # flake8-bandit (dodgy-equivalent)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "PERF",   # perflint
]
ignore = [
    "PLC0415",  # import-outside-toplevel (see .pylintrc)
    "SIM108",   # if-else block vs ternary
    "B905",     # zip without explicit strict
    "RUF001",   # ambiguous unicode in strings
    "PTH",      # use pathlib - gradual migration, not enforced yet
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is idiomatic in pytest, not "dodgy" there

[tool.ruff.format]
# Black-compatible by default


# -- mypy configuration -------------------------------------------------------

[tool.mypy]
ignore_missing_imports = true
exclude = ["^openairclim/gui/", "^tests/gui/"]


# -- pixi setup ---------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"  # 3.13 set for development
ambiance = "*"
deepmerge = "*"
joblib = "*"
matplotlib-base = "*"
netcdf4 = "*"
numpy = "*"
pandas = "<3"
pint = "*"
platformdirs = "*"
pydantic = "*"
requests = "*"
scipy = "*"
xarray = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# default environment
[tool.pixi.pypi-dependencies]
openairclim = { path = ".", editable = true }

[tool.pixi.tasks]
# run the example.toml file in the default environment
test-example = { cmd = "oac-run example.toml", cwd = "example" }

# regenerate environment_minimal.yaml/environment_dev.yaml
# NOTE: some dependencies are not available at conda-forge. These will be installed
# by pixi automatically, but need to be added to scripts/export.envs.sh manually!
export-envs = "bash scripts/export-envs.sh"

# docs environment
[tool.pixi.feature.docs.dependencies]
# genbadge[coverage] PyPI-only
ipykernel = "*"
myst-nb = "*"
panel = "*"
param = "*"
sphinx = "*"
sphinxcontrib-bibtex = "*"
sphinxcontrib-mermaid = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"

[tool.pixi.feature.docs.pypi-dependencies]
openairclim = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.feature.docs.tasks]
# equivalent to `make html`/`make clean`
docs-build = "sphinx-build -M html docs/source docs/build"
docs-clean = "sphinx-build -M clean docs/source docs/build"

# dev environment
[tool.pixi.feature.dev.dependencies]
# genbadge[coverage] PyPI-only (see scripts/export-envs.sh)
ipykernel = "*"
mypy = "*"
myst-nb = "*"
panel = "*"
param = "*"
pytest = "*"
pytest-cov = "*"
python-build = "*"  # "build" on PyPI is "python-build" on conda-forge
ruff = "*"
snakeviz = "*"
sphinx = "*"
sphinxcontrib-bibtex = "*"
sphinxcontrib-mermaid = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"
twine = "*"

[tool.pixi.feature.dev.pypi-dependencies]
openairclim = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.dev.tasks]
# make tmp directory
mktmp = "mkdir -p tmp"

# correctness and style mirror the lint.yml workflow
corr-mypy = "mypy openairclim tests"
corr-ruff = "ruff check --select F"
correctness = { depends-on = ["corr-mypy", "corr-ruff"] }
style-ruff = "ruff check --ignore F"
format-check = "ruff format --check"
style = { depends-on = ["style-ruff", "format-check"] }

# other ruff commands
lint-fix = "ruff check --fix"
format = "ruff format"

# check the build
build-sdist = "python -m build"
twine-check = "twine check dist/*"
build = { depends-on = ["build-sdist", "twine-check"] }

# test and coverage-badge mirror the quick-test.yml / build-docs.yml workflows
create-test-files = "python -m openairclim.utils.create_test_files -o tests/core/repository/"
test = { cmd = "pytest", depends-on = ["create-test-files"] }
cov-run = { cmd = "pytest --cov=openairclim --cov-report=xml", depends-on = ["create-test-files"] }
cov-badge = { cmd = "genbadge coverage -i coverage.xml -o docs/source/_static/coverage.svg", depends-on = ["cov-run"] }

# analyse profile
profile-example = { cmd = """\
    python -m cProfile \
        -o ../tmp/profile.prof \
        -m openairclim example.toml\
    """, cwd = "example", depends-on = ["mktmp"] }
view-profile = "snakeviz tmp/profile.prof"
